# Install as /etc/nginx/sites-available/taskflow and enable it.
# CHANGE: 10.0.2.4 must be the Windows VM's private IP in the same Azure VNet.
# This HTTP-only config is for initial connectivity testing. Add HTTPS on
# the Linux public site before any public/internet deployment.
server {
    listen 80;
    server_name _;

    root /var/www/taskflow;
    index index.html;

    # Same-origin API calls: the browser hits Linux, Nginx calls Windows IIS.
    # Important: no trailing slash on proxy_pass, preserving /api/* path.
    location /api/ {
        proxy_pass http://10.0.2.4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Blazor startup assets must be served as files, never as index.html.
    location /_framework/ {
        try_files $uri =404;
    }

    # Correct type for WASM files on older Nginx packages.
    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # Blazor SPA navigation support.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
